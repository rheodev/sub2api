name: Frontend2 Package

on:
  push:
    branches: [feat/new-frontend]
    paths:
      - frontend2/**
      - backend/**
      - docs/legal/**
      - Dockerfile
      - .dockerignore
      - deploy/docker-compose.yml
      - .github/workflows/frontend2-package.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: frontend2-package
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=frontend2-$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "revision=frontend2-sha-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build image for startup verification
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: sub2api:frontend2-smoke
          build-args: |
            FRONTEND_APP=frontend2
            VERSION=${{ steps.image.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.image.outputs.created }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          cache-from: type=gha,scope=frontend2-package
          cache-to: type=gha,mode=max,scope=frontend2-package
      - name: Verify application and embedded frontend
        shell: bash
        env:
          SUB2API_IMAGE: sub2api:frontend2-smoke
          BIND_HOST: 127.0.0.1
          SERVER_PORT: 18080
          POSTGRES_PASSWORD: ci-database-password
          ADMIN_EMAIL: ci@example.invalid
          ADMIN_PASSWORD: ci-admin-password-2026
          JWT_SECRET: ci-jwt-secret-for-isolated-smoke-testing-only
          TOTP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          DATABASE_MAX_OPEN_CONNS: 20
          DATABASE_MAX_IDLE_CONNS: 5
          REDIS_POOL_SIZE: 50
        run: |
          docker compose -f deploy/docker-compose.yml -p frontend2-smoke up -d --wait --wait-timeout 240
          curl --fail --silent http://127.0.0.1:18080/health | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
          curl --fail --silent http://127.0.0.1:18080/home > "$RUNNER_TEMP/home.html"
          grep -q 'type="module"' "$RUNNER_TEMP/home.html"
          docker cp sub2api:/app/sub2api "$RUNNER_TEMP/sub2api"
          docker run --rm --entrypoint sh sub2api:frontend2-smoke -c 'test -x /app/sub2api && pg_dump --version && psql --version'
          # Check the embedded homepage rather than just the server shell.
          grep -a -q 'welcome-studio' "$RUNNER_TEMP/sub2api"
      - name: Startup logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml -p frontend2-smoke logs --no-color --tail 100
        env:
          POSTGRES_PASSWORD: ci-database-password
      - name: Stop smoke test services
        if: always()
        run: docker compose -f deploy/docker-compose.yml -p frontend2-smoke down --volumes
        env:
          POSTGRES_PASSWORD: ci-database-password
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish amd64 and arm64 images
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:frontend2
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.revision }}
          labels: |
            maintainer=rheodev <https://github.com/rheodev>
            description=AI Space - AI services and team management
            org.opencontainers.image.authors=rheodev
            org.opencontainers.image.title=AI Space
            org.opencontainers.image.description=AI Space - AI services and team management
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.created=${{ steps.image.outputs.created }}
          build-args: |
            FRONTEND_APP=frontend2
            VERSION=${{ steps.image.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.image.outputs.created }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          cache-from: type=gha,scope=frontend2-package
          cache-to: type=gha,mode=max,scope=frontend2-package
      - name: Verify published manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE"
          printf '### Published frontend2\n\n`%s`\n\nDigest: `%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
