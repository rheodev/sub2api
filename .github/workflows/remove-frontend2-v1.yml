name: Remove superseded frontend2 v1 package

on:
  push:
    branches: [feat/new-frontend]
    paths: [.github/workflows/remove-frontend2-v1.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Delete only the superseded v1 image
        shell: bash
        run: |
          gh api --paginate --slurp users/rheodev/packages/container/sub2api/versions > "$RUNNER_TEMP/versions.json"
          python3 - "$RUNNER_TEMP/versions.json" "$RUNNER_TEMP/old-version-id" <<'PY'
          import json, sys
          from pathlib import Path
          versions = [v for page in json.loads(Path(sys.argv[1]).read_text()) for v in page]
          tags = lambda version: version['metadata']['container']['tags']
          current = [v for v in versions if 'frontend2-20261022.3' in tags(v)]
          assert len(current) == 1, 'Published v3 must exist before deletion'
          assert 'frontend2' in tags(current[0]), 'Latest frontend2 must point to v3'
          old = [v for v in versions if 'frontend2-20261022.1' in tags(v)]
          assert len(old) <= 1, 'Ambiguous v1 image'
          if old:
              assert old[0]['name'] == 'sha256:b7827fd483f7c37563894fb870f7383a33b4a59fe26714b49b926171212be9c8'
              assert set(tags(old[0])) <= {'frontend2-20261022.1', 'frontend2-sha-d3d4fb5e1a8e'}, 'Unexpected tag on v1 image'
              assert old[0]['id'] != current[0]['id']
              Path(sys.argv[2]).write_text(str(old[0]['id']))
              print('Deleting old image version:', old[0]['id'], tags(old[0]))
          else:
              print('Old v1 image is already absent')
          PY
          if [ -s "$RUNNER_TEMP/old-version-id" ]; then
            version_id=$(cat "$RUNNER_TEMP/old-version-id")
            gh api --method DELETE "users/rheodev/packages/container/sub2api/versions/$version_id"
          fi
          gh api --paginate --slurp users/rheodev/packages/container/sub2api/versions > "$RUNNER_TEMP/remaining.json"
          python3 - "$RUNNER_TEMP/remaining.json" <<'PY'
          import json, sys
          versions = [v for page in json.load(open(sys.argv[1])) for v in page]
          tags = [tag for v in versions for tag in v['metadata']['container']['tags']]
          assert 'frontend2-20261022.1' not in tags
          assert 'frontend2-20261022.3' in tags
          assert 'frontend2' in tags
          print('Verified: v1 removed; v3 and frontend2 retained')
          PY
